services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nebula-score-backend
    ports:
      - "8000:8000"
    environment:
      - nebula_env=development
      - nebula_database_url=sqlite:////app/data/nebula_score.db
      - nebula_cors_origins=http://localhost:5173,http://localhost:3000,http://localhost
      - nebula_host=0.0.0.0
      - nebula_port=8000
    volumes:
      - ./backend:/app/backend:ro
      - ./methodologies:/app/methodologies:ro
      - nebula_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nebula-score-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  nebula_data:
